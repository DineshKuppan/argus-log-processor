spring.application.name=argus-log-processor
server.port=9000
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
log.max-file-size=52428800

#Streaming ingest (P0) - batch = in-memory unit, segment = durability unit
argus.ingest.batch-max-lines=10000
argus.ingest.batch-max-bytes=8MB
argus.ingest.segment-bytes=500MB
argus.ingest.raw-queue-capacity=2
argus.ingest.parsed-queue-capacity=4
argus.ingest.max-line-bytes=1MB
argus.ingest.max-concurrent-jobs=2
argus.ingest.allowed-roots=./src/main/resources/logs,./data/in
argus.ingest.checkpoint-dir=./data/checkpoints
# Lines no parser understands are stored as raw records (false: dropped and counted as rejected)
argus.ingest.keep-unparsed=true
argus.sink.local.root=./data/out
argus.sink.local.min-free-bytes=2GB

#Suppression (P1b) - a message is allowed once per tenant per window (store: local | redis)
argus.suppression.window=10s
argus.suppression.max-keys=100000
argus.suppression.store=local
argus.suppression.template-fingerprint=false

#Redis Cache Configuration
spring.cache.type=redis
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
# Short timeouts so the Redis suppression store fails open quickly (Lettuce's default is 60s)
spring.data.redis.timeout=100ms
spring.data.redis.connect-timeout=200ms
spring.cache.redis.time-to-live=600000

spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/resources
spring.devtools.restart.exclude=static/**,public/**
spring.devtools.livereload.enabled=true