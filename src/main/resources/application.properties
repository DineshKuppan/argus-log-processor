spring.application.name=argus-log-processor
server.port=9000
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
log.max-file-size=52428800
# v1 reads only files under argus.ingest.allowed-roots (as v2); false = warn only (migration window)
log.enforce-allowed-roots=true
# v1 aggregations stream files of any size; more than this many at once get 429 + Retry-After
log.max-concurrent-aggregations=2

#Streaming ingest (P0) - batch = in-memory unit, segment = durability unit
argus.ingest.batch-max-lines=10000
argus.ingest.batch-max-bytes=8MB
argus.ingest.segment-bytes=500MB
argus.ingest.raw-queue-capacity=2
argus.ingest.parsed-queue-capacity=4
argus.ingest.max-line-bytes=1MB
argus.ingest.max-concurrent-jobs=2
argus.ingest.allowed-roots=./src/main/resources/logs,./data/in
argus.ingest.checkpoint-dir=./data/checkpoints
# Lines no parser understands are stored as raw records (false: dropped and counted as rejected)
argus.ingest.keep-unparsed=true
argus.sink.local.root=./data/out
argus.sink.local.min-free-bytes=2GB

#Parquet archive (P2) - store: none | filesystem | s3. With a store, argus.sink.local.root becomes the WAL:
#each committed segment is converted to Parquet + ZSTD, uploaded, then deleted. delete-after-upload=false keeps it
#(marked .archived) forever: the volume then needs its own retention, or ingest stops when it is full
argus.archive.store=none
argus.archive.prefix=
argus.archive.delete-after-upload=true
argus.archive.scan-interval=10s
argus.archive.staging-dir=./data/archive-staging
argus.archive.row-group-size=64MB
argus.archive.retry-initial=1s
argus.archive.retry-max=5m
argus.archive.filesystem.root=./data/archive
#S3: credentials come from the AWS SDK's default chain (env, profile, IRSA, instance role), never from here
#argus.archive.s3.bucket=my-log-archive
#argus.archive.s3.region=eu-west-1
#S3-compatible stores: endpoint + path-style; checksums=when-required for stores that reject SDK checksums
#argus.archive.s3.endpoint=http://localhost:9000
#argus.archive.s3.path-style=true
#argus.archive.s3.checksums=when-required

#Suppression (P1b) - a message is allowed once per tenant per window (store: local | redis)
argus.suppression.window=10s
argus.suppression.max-keys=100000
argus.suppression.store=local
argus.suppression.template-fingerprint=false

#Tenancy - every /api request (v1 and v2) carries an API key (X-Argus-Api-Key or Authorization: Bearer); only its
#SHA-256 is configured: printf %s "$KEY" | shasum -a 256. With no keys, the API answers 401.
#mode=header trusts a caller-chosen X-Argus-Tenant header: local development only.
argus.tenancy.mode=api-key
#argus.tenancy.api-keys[0].tenant=acme
#argus.tenancy.api-keys[0].key-sha256=<64 hex chars>
#Directories this tenant may read (v1 and v2); without them it shares argus.ingest.allowed-roots
#argus.tenancy.api-keys[0].allowed-roots=./data/in/acme

#Redis Cache Configuration
spring.cache.type=redis
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
# Short timeouts so the Redis suppression store fails open quickly (Lettuce's default is 60s)
spring.data.redis.timeout=100ms
spring.data.redis.connect-timeout=200ms
spring.cache.redis.time-to-live=600000

spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/resources
spring.devtools.restart.exclude=static/**,public/**
spring.devtools.livereload.enabled=true