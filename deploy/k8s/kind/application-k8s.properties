# kind: what differs from the base (the generator replaces the base's file, so it is complete).
argus.wal.store=kafka
argus.kafka.bootstrap-servers=kafka:9092
argus.kafka.topic=argus-wal
argus.kafka.tail-topic=argus-tail
argus.kafka.create-topics=true
argus.kafka.partitions=6
argus.kafka.replication-factor=1
argus.kafka.staging-dir=/data/kafka-staging

argus.ingest.checkpoint-dir=/data/checkpoints
argus.ingest.allowed-roots=/data/in
argus.ingest.segment-bytes=4MB
argus.sink.local.root=/data/wal
argus.sink.local.compression=zstd
argus.push.spool-dir=/data/spool
argus.push.flush-interval=5s
argus.quota.ingest-bytes-per-second=1GB

argus.archive.store=s3
argus.archive.prefix=argus
argus.archive.s3.bucket=argus-archive
argus.archive.s3.region=us-east-1
argus.archive.s3.endpoint=http://s3mock:9090
argus.archive.s3.path-style=true
argus.archive.s3.checksums=when-required
argus.archive.staging-dir=/data/parquet
argus.archive.retry-max=5s

argus.suppression.store=redis
spring.data.redis.host=redis

argus.instance.drain-timeout=90s
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

