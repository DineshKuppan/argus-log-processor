# The headless service gives each pod a stable DNS name (argus-0.argus-headless); the ClusterIP
# service is what the ingress routes to.
apiVersion: v1
kind: Service
metadata:
  name: argus-headless
spec:
  clusterIP: None
  selector: {app: argus}
  ports:
    - {name: http, port: 9000}
---
apiVersion: v1
kind: Service
metadata:
  name: argus
spec:
  selector: {app: argus}
  ports:
    - {name: http, port: 9000, targetPort: http}
    - {name: management, port: 9001, targetPort: management}
